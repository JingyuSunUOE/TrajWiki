apiVersion: batch/v1
kind: Job
metadata:
    generateName: trajwiki-rebuttal-
    labels:
        kueue.x-k8s.io/queue-name: eidf098ns-user-queue
        trajwiki.org/workflow: WORKFLOW_ID
        trajwiki.org/mode: JOB_MODE
        trajwiki.org/image-source: IMAGE_SOURCE
spec:
    backoffLimit: 0
    activeDeadlineSeconds: 86400
    parallelism: 1
    completions: 1
    template:
        metadata:
            name: trajwiki-rebuttal
            labels:
                trajwiki.org/workflow: WORKFLOW_ID
                trajwiki.org/mode: JOB_MODE
                trajwiki.org/image-source: IMAGE_SOURCE
        spec:
            containers:
            - name: traj
              image: jingyusun/traj:latest
              terminationMessagePath: "/tmp/my-log"
              imagePullPolicy: "Always"
              command: [ "/opt/trajwiki/scripts/run_rebuttal_answer_ablation.sh" ]
              args: [ "formal" ]
              env:
                    - name: TRAJWIKI_WORKFLOW_ID
                      value: "WORKFLOW_ID"
                    - name: TRAJWIKI_IMAGE_REF
                      value: "IMAGE_REF_VALUE"
                    - name: TRAJWIKI_PROJECT_DIR
                      value: "PROJECT_DIR_VALUE"
                    - name: TRAJWIKI_REBUTTAL_PRIVATE_DIR
                      value: "PRIVATE_DIR_VALUE"
                    - name: TRAJWIKI_BUNDLE_PATH
                      value: "BUNDLE_PATH_VALUE"
                    - name: TRAJWIKI_RUN_DIR
                      value: "RUN_DIR_VALUE"
                    - name: TRAJWIKI_MEM0_SOURCE
                      value: "MEM0_SOURCE_VALUE"
                    - name: TRAJWIKI_PARENT_60_EXPERIMENT
                      value: "PARENT_60_VALUE"
              resources:
                    requests:
                        cpu: 6
                        memory: '128Gi'
                        nvidia.com/gpu: 1
                    limits:
                        cpu: 6
                        memory: '128Gi'
                        nvidia.com/gpu: 1
              volumeMounts:
                    - mountPath: /dev/shm
                      name: dshm
                    - mountPath: /data
                      name: test-nfs
            restartPolicy: Never
            securityContext:
              runAsUser: 35761  #nfs user id
              runAsGroup: 4451  #nfs group id
              runAsNonRoot: true
            volumes:
            - emptyDir:
                medium: Memory
                sizeLimit: 128Gi
              name: dshm
            - name: test-nfs
              nfs:
                  server: 10.24.6.66
                  path: /
            nodeSelector:
                nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
